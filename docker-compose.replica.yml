# Home PC (secondary replica). Same image as the cloud, different role.
#   docker compose -f docker-compose.replica.yml up -d --build
services:
  photo-upload:
    build: .
    container_name: photo-upload-backend
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      STORAGE_LOCAL_PATH: /app/uploads
      REPLICATION_ENABLED: "true"
      REPLICATION_ROLE: replica
      # The cloud is reached through its public Funnel URL: stable across VM
      # recreation and resolvable from inside the container.
      REPLICATION_PEER_URL: ${REPLICATION_PEER_URL}
      REPLICATION_TOKEN: ${REPLICATION_TOKEN}
      REPLICATION_STATE_PATH: /app/data
      REPLICATION_RECONCILE_INTERVAL_MS: ${REPLICATION_RECONCILE_INTERVAL_MS:-60000}
      UPLOAD_RATE_LIMIT_PER_MINUTE: ${UPLOAD_RATE_LIMIT_PER_MINUTE:-1000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Keep the archive OUT of OneDrive: thousands of photos being written while
      # OneDrive syncs is a recipe for locked files.
      - ${PC_STORAGE_PATH:-C:/fotos-casamiento}:/app/uploads
      - ${PC_DATA_PATH:-C:/photo-upload-data}:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
